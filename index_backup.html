<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENTS_IA — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">🤖</div>
      <div>
        <h1>AGENTS_IA</h1>
        <div class="subtitle">Pilotage des agents &amp; des missions</div>
      </div>
    </div>
    <div class="status-pill">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connexion au backend…</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card" style="--accent-color:#8b5cf6">
      <div class="stat-label">Agents</div>
      <div class="stat-value" id="stat-agents">–</div>
    </div>
    <div class="stat-card" style="--accent-color:#f5a524">
      <div class="stat-label">En attente</div>
      <div class="stat-value" id="stat-pending">–</div>
    </div>
    <div class="stat-card" style="--accent-color:#4f8cff">
      <div class="stat-label">En cours</div>
      <div class="stat-value" id="stat-running">–</div>
    </div>
    <div class="stat-card" style="--accent-color:#22c55e">
      <div class="stat-label">Terminées</div>
      <div class="stat-value" id="stat-completed">–</div>
    </div>
  </div>

  <div class="layout">

    <section class="panel">
      <div class="panel-head">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Agents
        </h2>
        <span class="count-chip" id="agent-count">0</span>
      </div>
      <div class="agent-list" id="agent-list">
        <p class="empty">Chargement…</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Missions
        </h2>
        <span class="count-chip" id="task-count">0</span>
      </div>

      <form class="new-task" id="new-task-form">
        <div class="field-label">Agent assigné</div>
        <select id="task-agent" required></select>
        <div class="field-label">Description de la mission</div>
        <textarea id="task-desc" placeholder="Ex. : Documenter la route /api/v1/products…" required></textarea>
        <button type="submit" class="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Créer la mission
        </button>
      </form>

      <div class="task-list" id="task-list">
        <p class="empty">Chargement…</p>
      </div>
    </section>

  </div>

  <div id="toasts"></div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">Terminer la mission</h3>
      <textarea id="modal-input" placeholder="Décris le résultat…"></textarea>
      <div class="modal-actions">
        <button class="ghost" id="modal-cancel">Annuler</button>
        <button class="primary" id="modal-confirm">Valider</button>
      </div>
    </div>
  </div>

<script>
const API = "http://localhost:3000";

const icons = {
  empty: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 9h6v6H9z"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  bolt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>`
};

const statusLabel = {
  idle: "idle", working: "working",
  pending: "attente", running: "en cours",
  completed: "terminé", failed: "échoué"
};

const badge = (status) =>
  `<span class="badge badge-${status}">${statusLabel[status] || status}</span>`;

const initials = (name) =>
  name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();

function toast(message, kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ---------- Modal (remplace prompt()/alert()) ----------
let modalResolve = null;
const overlay = document.getElementById("modal-overlay");
const modalInput = document.getElementById("modal-input");

function askModal(title, placeholder) {
  document.getElementById("modal-title").textContent = title;
  modalInput.placeholder = placeholder;
  modalInput.value = "";
  overlay.classList.remove("hidden");
  modalInput.focus();
  return new Promise(resolve => { modalResolve = resolve; });
}

document.getElementById("modal-cancel").onclick = () => {
  overlay.classList.add("hidden");
  if (modalResolve) modalResolve(null);
};
document.getElementById("modal-confirm").onclick = () => {
  overlay.classList.add("hidden");
  if (modalResolve) modalResolve(modalInput.value.trim());
};

// ---------- Data loading ----------

async function loadAgents() {
  const res = await fetch(`${API}/api/agents`);
  const agents = await res.json();

  document.getElementById("agent-count").textContent = agents.length;
  document.getElementById("stat-agents").textContent = agents.length;

  const list = document.getElementById("agent-list");
  list.innerHTML = agents.length
    ? agents.map(a => `
        <div class="agent-card">
          <div class="avatar">${initials(a.name)}</div>
          <div class="agent-info">
            <div class="agent-name">${a.name}</div>
            <div class="agent-role">${a.role}</div>
          </div>
          ${badge(a.status)}
        </div>
      `).join("")
    : `<p class="empty">${icons.empty}<br>Aucun agent.</p>`;

  const select = document.getElementById("task-agent");
  const prev = select.value;
  select.innerHTML = agents.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
  if (prev) select.value = prev;
}

async function loadTasks() {
  const res = await fetch(`${API}/api/tasks`);
  const tasks = await res.json();

  document.getElementById("task-count").textContent = tasks.length;
  document.getElementById("stat-pending").textContent = tasks.filter(t => t.status === "pending").length;
  document.getElementById("stat-running").textContent = tasks.filter(t => t.status === "running").length;
  document.getElementById("stat-completed").textContent = tasks.filter(t => t.status === "completed").length;

  const list = document.getElementById("task-list");
  list.innerHTML = tasks.length
    ? tasks.slice().reverse().map(t => `
        <div class="task-card border-${t.status}">
          <div class="task-top">
            <span class="task-id">#${t.id}</span>
            ${badge(t.status)}
          </div>
          <div class="task-desc">${t.description}</div>
          <div class="task-meta">Agent #${t.agentId}</div>
          ${t.result ? `<div class="task-result">${t.result}</div>` : ""}
          ${t.error ? `<div class="task-error">${t.error}</div>` : ""}
          <div class="task-actions">
            ${t.status === "pending" ? `<button class="ghost" onclick="startTask(${t.id})">${icons.play} Démarrer</button>` : ""}
            ${t.status === "pending" || t.status === "running" ? `<button class="success" onclick="executeTask(${t.id})">${icons.bolt} Exécuter</button>` : ""}
            ${t.status === "running" ? `<button class="ghost" onclick="completeTask(${t.id})">${icons.check} Terminer</button>` : ""}
            ${t.status === "running" ? `<button class="danger" onclick="failTask(${t.id})">${icons.x} Échec</button>` : ""}
          </div>
        </div>
      `).join("")
    : `<p class="empty">${icons.empty}<br>Aucune mission pour l'instant.</p>`;
}

async function refresh() {
  try {
    await Promise.all([loadAgents(), loadTasks()]);
    document.getElementById("status-dot").className = "dot online";
    document.getElementById("status-text").textContent = "Backend connecté";
  } catch (e) {
    document.getElementById("status-dot").className = "dot offline";
    document.getElementById("status-text").textContent = "Backend injoignable";
  }
}

// ---------- Actions ----------

document.getElementById("new-task-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const agentId = document.getElementById("task-agent").value;
  const task = document.getElementById("task-desc").value;

  const res = await fetch(`${API}/api/tasks`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agentId, task })
  });

  if (res.ok) {
    toast("Mission créée", "success");
    document.getElementById("task-desc").value = "";
  } else {
    toast("Erreur lors de la création", "error");
  }
  await refresh();
});

async function startTask(taskId) {
  await fetch(`${API}/api/tasks/start`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ taskId })
  });
  toast(`Mission #${taskId} démarrée`);
  await refresh();
}

async function executeTask(taskId) {
  await fetch(`${API}/api/tasks/execute`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ taskId })
  });
  toast(`Mission #${taskId} exécutée`, "success");
  await refresh();
}

async function completeTask(taskId) {
  const result = await askModal("Terminer la mission", "Décris le résultat obtenu…");
  if (!result) return;
  await fetch(`${API}/api/tasks/complete`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ taskId, result })
  });
  toast(`Mission #${taskId} terminée`, "success");
  await refresh();
}

async function failTask(taskId) {
  const error = await askModal("Marquer en échec", "Décris la raison de l'échec…");
  if (!error) return;
  await fetch(`${API}/api/tasks/fail`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ taskId, error })
  });
  toast(`Mission #${taskId} échouée`, "error");
  await refresh();
}

refresh();
setInterval(refresh, 4000);
</script>

</body>
</html>
